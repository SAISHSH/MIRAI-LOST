<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRAI/LOST — Retro-Futurist Visual Systems</title>
  <meta name="description" content="Strategic graphic design, retro-futurist visual systems, and motion graphics bridging analog nostalgia with digital future.">

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MIRAI/LOST — Retro-Futurist Visual Systems">
  <meta property="og:description" content="Strategic graphic design, retro-futurist visual systems, and motion graphics.">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="MIRAI/LOST — Retro-Futurist Visual Systems">

  <!-- Typography: Geist & Inter via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Baseline Reset & Variables */
    :root {
      --bg-color: #0a0a0c;
      --text-color: #f0f0f5;
      --accent-color: #00ff66;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Retro CRT Overlay Effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.4;
    }

    /* Frame Container */
    .container {
      width: 90%;
      max-width: 900px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
    }

    /* Header Styling */
    header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 0.25rem 0.5rem;
      text-transform: uppercase;
    }

    /* Content Area */
    .content h1 {
      font-size: 2.5rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .content p {
      font-size: 1rem;
      color: #a0a0ab;
      line-height: 1.6;
      margin-bottom: 2rem;
      max-width: 600px;
    }

    /* Interactive Links */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .link-card {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      text-decoration: none;
      color: var(--text-color);
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link-card:hover {
      background-color: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
    }

    /* Utility Helpers */
    .mono { font-family: var(--font-mono); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">MIRAI / LOST</div>
      <div class="status-badge">SYS.ONLINE</div>
    </header>

    <main class="content">
      <h1>Retro-Futurist Visual Systems & Motion Graphics</h1>
      <p>Bridging analog nostalgia with digital future. Specializing in brand identity, 3D modeling, and high-impact visual design.</p>

      <div class="links-grid">
        <a href="#work" class="link-card">
          <span>[01] SELECTED WORKS</span>
          <span>→</span>
        </a>
        <a href="#about" class="link-card">
          <span>[02] SYSTEM INFO</span>
          <span>→</span>
        </a>
        <a href="#contact" class="link-card">
          <span>[03] TRANSMIT</span>
          <span>→</span>
        </a>
      </div>
    </main>
  </div>

</body>
</html>
